name: Collect overhead traffic

on:
  schedule:
    # Every hour, on the hour. GitHub runs these on a best-effort basis,
    # so some will be late or skipped. That is fine: we want a sample,
    # not a complete record.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Watch the box for five minutes
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: uv run python analysis/04_collect.py 300

      - name: Save what it found
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/observations
          if git diff --staged --quiet; then
            echo "Nothing new to commit"
            exit 0
          fi
          git commit -m "Collect $(date -u '+%Y-%m-%d %H:%M') UTC [skip ci]"
          git pull --rebase --autostash
          git push
